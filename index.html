<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日報・チェック・生産管理 プロトタイプ</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --line: #d1d5db; --text: #1f2937; --sub: #6b7280;
    --accent: #1d4ed8; --accent-bg: #dbeafe;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7; --ng: #b91c1c; --ng-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; }
  header { background: #111827; color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; }
  header small { color: #9ca3af; font-size: 12px; }
  .switch { display: flex; flex-wrap: wrap; background: #1f2937; border-radius: 10px; padding: 4px; gap: 4px; }
  .switch button { border: 0; background: transparent; color: #d1d5db; padding: 10px 14px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
  .switch button.on { background: #fff; color: #111827; font-weight: 500; }
  main { max-width: 1160px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; font-weight: 500; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 { font-size: 15px; font-weight: 500; margin: 18px 0 8px; }
  .step { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; align-items: center; justify-content: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 14px; font: inherit; cursor: pointer; min-height: 46px; text-align: left; color: var(--text); }
  .chip small { display: block; color: var(--sub); font-size: 12px; }
  .chip.on { border-color: var(--accent); background: var(--accent-bg); color: #1e3a8a; font-weight: 500; }
  .chip.sm { min-height: 38px; padding: 6px 12px; }
  .chip.dark { background: #111827; color: #fff; border-color: #111827; }
  .group-label { font-size: 13px; color: var(--sub); margin: 12px 0 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row.chk { grid-template-columns: 0.85fr 1.35fr; }
  @media (max-width: 860px) { .row, .row.chk { grid-template-columns: 1fr; } }
  .drawing { border: 1px solid var(--line); border-radius: 10px; background: #fcfcfd; padding: 8px; align-self: start; }
  .drawing svg { width: 100%; height: auto; display: block; }
  .drawing .cap { font-size: 12px; color: var(--sub); padding: 4px 4px 0; }
  .ball { display: inline-flex; flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); font-weight: 500; align-items: center; justify-content: center; font-size: 14px; }
  .spec { font-size: 12px; color: var(--sub); }
  .note { font-size: 13px; color: var(--sub); line-height: 1.7; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .b-OK { background: var(--ok-bg); color: var(--ok); } .b-注意 { background: var(--warn-bg); color: var(--warn); }
  .b-NG { background: var(--ng-bg); color: var(--ng); } .b-未 { background: #f3f4f6; color: var(--sub); }
  .b-副 { background: #ede9fe; color: #5b21b6; } .b-外 { background: var(--warn-bg); color: var(--warn); }
  .it { border-top: 1px solid #e5e7eb; padding: 12px 4px; }
  .it-head { display: flex; align-items: center; gap: 10px; }
  .it-name { flex: 1; }
  .it-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 0 38px; }
  .adj { min-width: 64px; height: 50px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font: inherit; cursor: pointer; color: var(--text); }
  .adj.big { background: #f3f4f6; }
  .adj:active { background: var(--accent-bg); }
  input.num { width: 130px; font: inherit; font-size: 20px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; text-align: right; }
  input.num.untouched { color: #9ca3af; }
  .nomb { min-height: 50px; }
  .dev { font-size: 13px; color: var(--sub); }
  .okng { display: flex; gap: 6px; }
  .okng button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; min-width: 80px; }
  .okng button.on.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 500; }
  .okng button.on.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); font-weight: 500; }
  .ngpanel { border: 2px solid var(--ng); background: var(--ng-bg); color: #7f1d1d; border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .ngpanel button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 0; cursor: pointer; }
  .ngpanel .call { background: var(--ng); color: #fff; } .ngpanel .re { background: #fff; color: var(--ng); border: 1px solid var(--ng); }
  .stepper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .stepper button { width: 60px; height: 54px; font-size: 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .stepper input { width: 96px; font-size: 24px; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; }
  textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; min-height: 60px; }
  .who { border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: var(--accent-bg); color: #1e3a8a; font-size: 17px; }
  .who.warn { background: var(--warn-bg); color: #78350f; }
  .submit { width: 100%; font: inherit; font-size: 19px; font-weight: 500; padding: 18px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; }
  .err { color: var(--ng); font-size: 14px; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 12px 20px; border-radius: 10px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .kpi .v { font-size: 26px; font-weight: 500; } .kpi .l { font-size: 12px; color: var(--sub); }
  .kpi.alert .v { color: var(--ng); }
  .ai { border-left: 4px solid #0f766e; border-radius: 0; background: #f0fdfa; }
  .ai ul { margin: 0; padding-left: 20px; line-height: 1.8; }
  .ai .tag { font-size: 11px; color: #0f766e; border: 1px solid #0f766e; border-radius: 4px; padding: 1px 6px; font-weight: 400; }
  .tablewrap { overflow-x: auto; }
  table.list { width: 100%; border-collapse: collapse; min-width: 760px; }
  table.list th { text-align: left; font-size: 12px; color: var(--sub); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.list td { padding: 9px 8px; border-bottom: 1px solid #eef0f3; vertical-align: middle; }
  table.list tr.click { cursor: pointer; } table.list tr.click:hover { background: #f9fafb; }
  table.list tr.sel { background: var(--accent-bg); }
  .ngrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid var(--ng-bg); background: #fff7f7; border-radius: 10px; margin-bottom: 8px; }
  .ngrow select, .ngrow button, .mini, .addrow select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .ngrow button, .mini.dark { background: var(--text); color: #fff; border: 0; cursor: pointer; }
  .mini { cursor: pointer; }
  .mini.del { color: var(--ng); }
  .done { color: var(--ok); font-size: 13px; }
  .banner { background: var(--warn-bg); color: #78350f; font-size: 13px; padding: 8px 16px; text-align: center; }
  .filt { display: grid; grid-template-columns: 52px 1fr; gap: 8px 10px; align-items: center; }
  .filt .fl { font-size: 13px; color: var(--sub); }
  .filt .fl b { color: var(--accent); font-weight: 500; }
  .mcols { display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mcol { border-right: 1px solid var(--line); background: #fff; min-height: 220px; }
  .mcol:last-child { border-right: 0; }
  .mhead { background: #f9fafb; padding: 10px 12px; font-size: 13px; color: var(--sub); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .mhead b { color: var(--text); font-weight: 500; }
  .mitem { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 6px; border: 0; border-bottom: 1px solid #f1f2f4; background: #fff; padding: 10px 12px; font: inherit; font-size: 14px; text-align: left; cursor: pointer; color: var(--text); }
  .mitem:hover { background: #f8fbff; }
  .mitem.on { background: var(--accent-bg); color: #1e3a8a; font-weight: 500; box-shadow: inset 3px 0 0 var(--accent); }
  .mitem small { display: block; color: var(--sub); font-size: 11px; font-weight: 400; }
  .cnt { font-size: 11px; color: var(--sub); background: #f3f4f6; border-radius: 999px; padding: 1px 7px; flex: none; }
  .warnbox { background: var(--warn-bg); color: #78350f; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.8; margin-bottom: 12px; }
  .addrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  table.ck input, table.ck select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; min-width: 60px; }
  table.ck input:disabled { background: #f3f4f6; color: #9ca3af; }
  table.ck td { padding: 6px 4px; }
  .preview { border: 1px dashed var(--line); border-radius: 10px; padding: 4px 12px; background: #fcfcfd; }
  .qrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .qrcard { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; cursor: pointer; }
  .qrcard:hover { border-color: var(--accent); background: #f8fbff; }
  .qrcard small { color: var(--sub); font-size: 12px; text-align: center; line-height: 1.5; }
  .qrbox { width: 96px; height: 96px; margin-bottom: 4px; }
  .qrbig { width: 150px; height: 150px; flex: none; }
  .qrbox img, .qrbox canvas, .qrbig img, .qrbig canvas { width: 100% !important; height: auto !important; }
  .scanframe { width: 140px; height: 140px; margin: 0 auto; border: 3px solid var(--accent); border-radius: 16px; position: relative; }
  .scanframe span { position: absolute; left: 12px; right: 12px; top: 50%; height: 2px; background: #ef4444; }
  .partHead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .big { font-size: 26px; font-weight: 500; letter-spacing: .02em; }
  .assign { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0 8px; }
  @media (max-width: 720px) { .assign { grid-template-columns: repeat(2, 1fr); } }
  .assign > div { background: var(--accent-bg); border-radius: 10px; padding: 10px 12px; }
  .assign b { display: block; font-size: 19px; font-weight: 500; color: #1e3a8a; }
  .linkbtn { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; padding: 0 4px; }
  details.anyemp summary { cursor: pointer; color: var(--accent); margin-top: 12px; font-size: 14px; }
  .qrprint { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 720px) { .qrprint { grid-template-columns: 1fr; } }
  .qrlabel { display: flex; gap: 14px; align-items: center; border: 1px dashed #9ca3af; border-radius: 8px; padding: 14px; background: #fff; }
  .url { font-size: 10px; color: var(--sub); word-break: break-all; margin-top: 6px; }
  .gantt { min-width: 920px; }
  .g-row { display: grid; grid-template-columns: 230px 1fr; align-items: center; border-top: 1px solid #eef0f3; }
  .g-head { border-top: 0; }
  .g-label { padding: 8px; font-size: 14px; }
  .g-days { display: grid; grid-template-columns: repeat(15, 1fr); font-size: 11px; color: var(--sub); text-align: center; }
  .g-track { position: relative; height: 46px; }
  .g-cell { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #e5e7eb; }
  .g-eq { background: #f9fafb; }
  .g-eq .g-track { height: 34px; }
  .g-load { position: absolute; top: 12px; height: 10px; background: #9ca3af; border-radius: 3px; border-right: 2px solid #f9fafb; }
  .g-load.dim { background: #d1d5db; }
  .g-bar { position: absolute; top: 8px; height: 30px; line-height: 30px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); font-size: 11px; padding: 0 6px; overflow: hidden; white-space: nowrap; color: #1f2937; }
  .g-setup { position: absolute; top: 8px; height: 30px; background: repeating-linear-gradient(45deg, #e5e7eb 0 4px, #f3f4f6 4px 8px); border-radius: 6px 0 0 6px; }
  .g-due { position: absolute; top: 4px; bottom: 4px; border-left: 3px solid; }
  .g-lane { cursor: grab; }
  .g-lane.dragging { opacity: .4; }
  .g-lane.over, .g-eq.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .handle { color: #9ca3af; margin-right: 4px; }
  .mvs { float: right; display: flex; gap: 2px; }
  .mv { border: 1px solid var(--line); background: #fff; border-radius: 6px; width: 28px; height: 26px; cursor: pointer; font-size: 10px; padding: 0; color: var(--sub); }
  .prog { height: 4px; background: #e5e7eb; border-radius: 2px; margin-top: 4px; width: 60px; } .prog div { height: 4px; background: var(--accent); border-radius: 2px; }
  .photos { border-top: 1px solid #e5e7eb; margin-top: 14px; padding-top: 4px; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
  .thumb { border: 1px solid var(--line); border-radius: 10px; padding: 6px; background: #fff; }
  .thumb img { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; display: block; background: #f3f4f6; }
  .thumb-foot { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-top: 6px; } .thumb .mini { white-space: nowrap; }
  .ocr { border: 2px dashed #a78bfa; background: #faf5ff; border-radius: 12px; padding: 14px; margin-top: 12px; }
  .ocrtext { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 0; }
  .progress { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; } .progress div { height: 10px; background: var(--ok); }
  .modes { display: flex; flex-wrap: wrap; gap: 4px; background: #f3f4f6; border-radius: 10px; padding: 4px; margin-bottom: 12px; }
  .modes button { border: 0; background: transparent; padding: 10px 14px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; color: var(--sub); }
  .modes button.on { background: #fff; color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .mini:disabled { opacity: .45; cursor: default; }
  .addrow input { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  body.floor .spec, body.floor .note, body.floor .dev { font-size: 15px; }
  body.floor .it-name { font-size: 18px; }
  body.floor .badge { font-size: 14px; }
  body.floor .group-label { font-size: 15px; }
  @media print { header, .banner, .noprint { display: none !important; } body { background: #fff; } main { padding: 0; max-width: none; } .qrlabel { break-inside: avoid; } }
</style>
</head>
<body>
<div class="banner">イメージ用のプロトタイプです。人名・品番・規格値はすべて架空です。入力と「決まり」の修正は、この端末の中だけに保存されます。</div>
<header>
  <div><h1>日報・チェック・生産管理（プロトタイプ）</h1><small id="today"></small></div>
  <div class="switch">
    <button data-view="input">入力（タブレット）</button>
    <button data-view="admin">確認（管理者）</button>
    <button data-view="plan">生産管理</button>
    <button data-view="master">決まりの修正（管理者）</button>
    <button data-view="qr">QRコード（印刷）</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できない環境では何もしない */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* 同上 */ } },
};
const clone = o => JSON.parse(JSON.stringify(o));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function nowHM() { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }

// ---------- マスター ----------
const EMPLOYEES = [
  { name: '山田 太郎', team: '1係' }, { name: '佐藤 健', team: '1係' },
  { name: '鈴木 一郎', team: '2係' }, { name: '高橋 誠', team: '2係' },
  { name: '田中 実', team: '4係' }, { name: '伊藤 翔', team: '4係' },
  { name: '渡辺 大', team: '5係' }, { name: '中村 光', team: '5係' },
];
const TEAMS = [...new Set(EMPLOYEES.map(e => e.team))];
const teamOf = name => (EMPLOYEES.find(e => e.name === name) || {}).team || '';
const PROCESSES = { LNC: ['LNC-20'], LNC2: ['LNC-42'], L: ['10L-01'], BR: ['BR-06', 'BR-07'], K: ['-'] };
const PROC_ORDER = Object.keys(PROCESSES);
const EQUIPS = Object.values(PROCESSES).flat();
const EQUIP_PROC = Object.fromEntries(Object.entries(PROCESSES).flatMap(([p, es]) => es.map(e => [e, p])));
const PARTS = {
  '3B51120040': { name: 'ボス', drawing: 'boss', route: ['LNC', 'BR', 'K'] },
  '7C22031150': { name: 'フランジ', drawing: 'flange', route: ['LNC2', 'BR', 'K'] },
  '5D40117620': { name: 'シャフト', drawing: 'shaft', route: ['LNC2', 'L', 'K'] },
};
const eqLabel = e => e === '-' ? '設備なし' : e;

// 決まり（ルーティング）：係 → 人 → 設備 → 工程 → 品番。1行＝「この人が、この設備で、この品番のこの工程をやる」
const DEFAULT_ROUTES = [
  ['3B51120040', 'LNC', 'LNC-20', '山田 太郎', true], ['3B51120040', 'LNC', 'LNC-20', '佐藤 健', false],
  ['3B51120040', 'BR', 'BR-06', '高橋 誠', true], ['3B51120040', 'BR', 'BR-07', '伊藤 翔', false],
  ['3B51120040', 'K', '-', '伊藤 翔', true],
  ['7C22031150', 'LNC2', 'LNC-42', '渡辺 大', true], ['7C22031150', 'BR', 'BR-07', '田中 実', true],
  ['7C22031150', 'K', '-', '中村 光', true],
  ['5D40117620', 'LNC2', 'LNC-42', '佐藤 健', true], ['5D40117620', 'L', '10L-01', '鈴木 一郎', true],
  ['5D40117620', 'K', '-', '伊藤 翔', true],
].map(([part, proc, equip, emp, main], i) => ({ id: 'r' + i, part, proc, equip, emp, main }));

const N = (n, name, label, nom, tm, tp, step, tool) => ({ n, name, type: 'num', label, nom, tm, tp, step, warn: 15, tool });
const O = (n, name, label, tool) => ({ n, name, type: 'ok', label, tool });
const DEFAULT_CHECKS = {

}

function scan(part, proc, push = true) {
  if (!PARTS[part]) { toast('登録されていない品番です'); return; }
  if (!proc || !PARTS[part]) proc = procsOf(part)[0] || PARTS[part].route[0];
  const r = mainRoute(part, proc);
  f = { ...blankF(), part, proc, equip: r ? r.equip : null, emp: r ? r.emp : null, team: r ? teamOf(r.emp) : null };
  editAssign = false; tried = false; view = 'input';
  if (push) history.pushState(null, '', `?part=${part}&proc=${proc}`);
  if (!r) toast('この品番×工程の決まりがありません。「決まりの修正」で足せます');
}
function clearPart(push = true) {
  f = blankF(); editAssign = false; tried = false; LS.del('kn-draft');
  if (push) history.pushState(null, '', location.pathname);
}
window.addEventListener('popstate', () => {
  const q = new URLSearchParams(location.search);
  q.get('part') ? scan(q.get('part'), q.get('proc'), false) : clearPart(false);
  render();
});
function drawQRs(size) {
  document.querySelectorAll('[data-qr]').forEach(el => {
    if (typeof QRCode === 'undefined') { el.innerHTML = '<div class="note">QRの表示にはネット接続が必要です</div>'; return; }
    const [part, proc] = el.dataset.qr.split('|');
    el.innerHTML = '';
    new QRCode(el, { text: partUrl(part, proc), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  });
}

function devText(it, v) {
  if (v === undefined || v === '') return `基準 ${it.nom.toFixed(decOf(it.step))}`;
  const x = parseFloat(v);
  if (isNaN(x)) return '';
  const d = x - it.nom;
  if (Math.abs(d) < it.step / 2) return '基準どおり';
  return `基準から ${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(decOf(it.step))}`;
}
function itemRow(it, values, preview = false) {
  const v = values[it.n], j = judge(it, v), dis = preview ? 'disabled' : '';
  const badge = `<span class="badge b-${j}" id="${preview ? '' : 'j' + it.n}">${j === '未' ? '未確認' : j}</span>`;
  const big = trimNum(it.step * 10);
  const ctl = it.type === 'num'
    ? `<button class="adj big" data-adj="${it.n}" data-mul="-10" ${dis}>−${big}</button>
       <button class="adj" data-adj="${it.n}" data-mul="-1" ${dis}>−${trimNum(it.step)}</button>
       <input class="num ${v === undefined ? 'untouched' : ''}" inputmode="decimal" data-num="${it.n}" value="${esc(v ?? it.nom.toFixed(decOf(it.step)))}" ${dis}>
       <button class="adj" data-adj="${it.n}" data-mul="1" ${dis}>＋${trimNum(it.step)}</button>
       <button class="adj big" data-adj="${it.n}" data-mul="10" ${dis}>＋${big}</button>
       <button class="chip nomb" data-nom="${it.n}" ${dis}>基準どおり</button>
       <span class="dev" id="${preview ? '' : 'dv' + it.n}">${devText(it, v)}</span>`
    : `<div class="okng"><button class="ok ${v === 'OK' ? 'on' : ''}" data-okng="${it.n}" data-v="OK" ${dis}>OK</button><button class="ng ${v === 'NG' ? 'on' : ''}" data-okng="${it.n}" data-v="NG" ${dis}>NG</button></div>`;
  return `<div class="it"><div class="it-head"><span class="ball">${it.n}</span><div class="it-name">${esc(it.name)}<div class="spec">${esc(specText(it))}・${esc(it.tool)}</div></div>${badge}</div><div class="it-ctl">${ctl}</div></div>`;
}

function submit() {
  tried = true;
  const items = currentItems();
  const hasNG = items.some(it => judge(it, f.values[it.n]) === 'NG');
  const paper = (f.photos || []).filter(x => x.kind === '紙のチェックシート');
  const ok = f.emp && f.equip && f.phase && f.qty > 0 && !items.some(it => judge(it, f.values[it.n]) === '未') && (!hasNG || f.called) && (items.length > 0 || paper.length > 0);
  if (!ok) { render(); return; }
  const no = Math.max(52310, ...reports.map(r => r.no)) + 1;
  const r = buildReport({ no, time: nextHM(), emp: f.emp, part: f.part, proc: f.proc, equip: f.equip, qty: f.qty, ngQty: f.ngQty, memo: f.memo, phase: f.phase, values: { ...f.values }, called: f.called, photos: (f.photos || []).slice() });
  reports.push(r); saveReports();
  if (items.length === 0 && paper.length) {
    const q = QUEUE.find(x => x.part === f.part && x.proc === f.proc);
    if (q) q.img = q.img || paper[0].src;
    else QUEUE.push({ id: 'q' + Date.now(), part: f.part, proc: f.proc, emp: f.emp, time: r.time, img: paper[0].src });
    saveQueue();
  }
  toast(`日報番号 ${no} で登録しました${r.role === '外' ? '（決まりにない人として管理者に知らせます）' : ''}`);
  clearPart(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- QR（印刷） ----------
function renderQR() {
  $('#app').innerHTML = `

    ${location.protocol === 'file:' ? '今はこのPCのファイルを指しています。Webに置くと、そのURLになります。' : 'このページのURLを指しているので、タブレットのカメラで読むとそのまま開きます。'}</p>
    <button class="chip dark" id="print">印刷する</button>
  </div>
  ${Object.keys(PARTS).map(part => `
    <div class="group-label">${part} ${PARTS[part].name}</div>
    <div class="qrprint">${procsOf(part).map(proc => {
      const r = mainRoute(part, proc);
      return `<div class="qrlabel"><div class="qrbig" data-qr="${part}|${proc}"></div>
        <div><div class="spec">品番 × 工程</div><div class="big">${part}</div><div style="font-size:18px">工程 ${proc}　${PARTS[part].name}</div>
        <div class="spec" style="margin-top:6px">主担当 ${r ? `${teamOf(r.emp)} ${r.emp}／${eqLabel(r.equip)}` : 'なし'}</div>
        <div class="url">${esc(partUrl(part, proc))}</div></div></div>`;
    }).join('')}</div>`).join('')}`;
  drawQRs(150);

// ---------- 描画と操作 ----------
function render() {
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.body.classList.toggle('floor', view === 'input');
  ({ input: renderInput, admin: renderAdmin, plan: renderPlan, master: renderMaster, qr: renderQR })[view]();
}
function setFilter(key, lvl, val) {
  const sel = key === 'input' ? f : FILTERS[key];
  const rows = key === 'input' ? inputRows() : key === 'admin' ? reports : key === 'plan' ? orderRows() : routeRows();
  const before = `${f.part}|${f.proc}`;
  sel[lvl] = val === '' ? null : val;
  LEVELS.slice(LEVELS.findIndex(([k]) => k === lvl) + 1).forEach(([k]) => { sel[k] = null; });
  prune(rows, sel);
  if (key === 'input') {
    autofill(rows, sel);
    if (sel.emp) sel.team = teamOf(sel.emp);
    if (`${f.part}|${f.proc}` !== before) { f.values = {}; f.called = null; }
    if (f.part && f.proc && !editAssign) history.pushState(null, '', `?part=${f.part}&proc=${f.proc}`);
  }
  if (key === 'master' && sel.part && sel.proc && masterEdit !== `${sel.part}|${sel.proc}`) openEditor(`${sel.part}|${sel.proc}`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button, tr[data-sel]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.view) { view = d.view; selected = null; }
  else if (d.f !== undefined) { const [key, lvl, ...v] = d.f.split('|'); setFilter(key, lvl, v.join('|')); }
  else if (d.scan) { const [p, q] = d.scan.split('|'); scan(p, q); toast(`QR を読みました：${p} 工程 ${q}`); }
  else if (b.id === 'rescan') clearPart();
  else if (b.id === 'editAssign') editAssign = true;
  else if (b.id === 'closeAssign') editAssign = false;
  else if (b.id === 'camera') { toast('プロトタイプではカメラは使いません。下のQRを押してください'); return; }
  else if (b.id === 'print') { window.print(); return; }
  else if (d.anyemp) { f.emp = d.anyemp; f.team = teamOf(d.anyemp); }
  else if (d.phase) f.phase = d.phase;
  else if (d.ngact === 're') { currentItems().forEach(it => { if (judge(it, f.values[it.n]) === 'NG') delete f.values[it.n]; }); toast('NG の項目を測り直してください'); }
  else if (d.ngact === 'call') { f.called = nowHM(); toast('係長に知らせました（イメージ）'); }
  else if (d.adj) {
    const it = currentItems().find(i => i.n === +d.adj);
    let v = parseFloat(f.values[it.n] ?? it.nom) + (+d.mul) * it.step;
    if (it.nom === 0 && it.tm === 0) v = Math.max(0, v);
    f.values[it.n] = v.toFixed(decOf(it.step));
  }
  else if (d.nom) { const it = currentItems().find(i => i.n === +d.nom); f.values[it.n] = it.nom.toFixed(decOf(it.step)); }
  else if (d.okng) f.values[d.okng] = d.v;
  else if (d.step) f[d.step] = Math.max(0, (parseInt(f[d.step]) || 0) + parseInt(d.d));
  else if (b.id === 'submit') { submit(); return; }
  else if (d.att) { ATT[d.att] = ATT[d.att] === false; LS.set('kn-att', ATT); }
  else if (d.sel) selected = selected === d.sel ? null : d.sel;
  else if (d.confirm) { const r = reports.find(x => x.id === d.confirm); r.confirmed = `${$('#act-' + r.id).value}（${nowHM()}）`; saveReports(); toast('確認済みにしました'); }
  else if (d.mv) { if (!stepOrder(d.mv, +d.dir)) return; toast('順番を入れ替えて計算し直しました'); }
  else if (d.setmain) {
    const r = ROUTES.find(x => x.id === d.setmain);
    ROUTES.forEach(x => { if (x.part === r.part && x.proc === r.proc) x.main = x.id === r.id; });
    saveMaster(); toast(`${r.part} × 工程 ${r.proc} の主担当を ${r.emp} さんにしました。QRを読むとこの人が入ります`);
  }
  else if (d.delroute) {
    const r = ROUTES.find(x => x.id === d.delroute);
    if (!confirm(`${r.emp} さん・${eqLabel(r.equip)}・${r.part} ${r.proc} の決まりを外しますか？`)) return;
    ROUTES = ROUTES.filter(x => x.id !== r.id);
    if (r.main) { const n = ROUTES.find(x => x.part === r.part && x.proc === r.proc); if (n) n.main = true; }
    saveMaster(); prune(routeRows(), FILTERS.master); toast('決まりを外しました');
  }
  else if (b.id === 'addRoute') {
    const emp = $('#addEmp').value, equip = $('#addEquip').value, part = $('#addPart').value, proc = EQUIP_PROC[equip];
    if (ROUTES.some(x => x.emp === emp && x.equip === equip && x.part === part && x.proc === proc)) { toast('同じ決まりがもうあります'); return; }
    const first = !ROUTES.some(x => x.part === part && x.proc === proc);
    ROUTES.push({ id: 'r' + Date.now(), part, proc, equip, emp, main: first });
    if (!PARTS[part].route.includes(proc)) PARTS[part].route.push(proc);
    if (!CHECKS[`${part}|${proc}`]) CHECKS[`${part}|${proc}`] = [];
    saveMaster();
    Object.assign(FILTERS.master, { team: teamOf(emp), emp, equip, proc, part });
    openEditor(`${part}|${proc}`);
    toast(`${emp} さんが ${eqLabel(equip)} で ${part}（工程 ${proc}）をやる決まりを足しました${first ? '（主担当）' : ''}`);
  }
  else if (d.editck) { if (masterEdit === d.editck && ckMode === 'table') masterEdit = null; else openEditor(d.editck); }
  else if (d.ckmode) {
    ckMode = d.ckmode;
    if (ckMode === 'tpl' && !tplDraft) setTpl(TPL_FOR_PROC[masterEdit.split('|')[1]] || Object.keys(TEMPLATES)[0]);
    if (ckMode === 'ai' && !aiDraft) { const [p, q] = masterEdit.split('|'); const qd = QUEUE.find(x => x.part === p && x.proc === q); if (qd) { aiImg = qd.img || QIMG[qd.id] || 'sample'; aiDraft = aiDraftFor(p, q); } }
  }
  else if (d.tpl) setTpl(d.tpl);
  else if (b.id === 'tplApply') {
    const miss = tplDraft.filter(it => it.use && it.type === 'num' && (it.nom === '' || isNaN(parseFloat(it.nom))));
    if (miss.length) { toast(`基準値が入っていません：${miss.map(x => x.name).join('、')}`); return; }
    const n0 = itemsFor(...masterEdit.split('|')).length;
    applyItems(tplDraft.map(it => it.type === 'num' ? { ...it, nom: parseFloat(it.nom), label: (!it.label || /[φ.]$/.test(it.label)) ? `${it.label}${it.nom}` : it.label } : it));
    toast(`ひな形から ${itemsFor(...masterEdit.split('|')).length - n0} 項目を作りました。タブレットにすぐ出ます`);
  }
  else if (b.id === 'copyApply') {
    const n0 = itemsFor(...masterEdit.split('|')).length;
    if (n0 && !confirm('今ある項目の後ろに足しますか？')) return;
    applyItems(clone(CHECKS[copyFrom]));
    toast('写しました。基準値など違うところだけ直してください');
  }
  else if (b.id === 'aiSample') { aiImg = 'sample'; aiDraft = aiDraftFor(...masterEdit.split('|')); }
  else if (d.fromqueue) { const q = QUEUE.find(x => x.id === d.fromqueue); openEditor(`${q.part}|${q.proc}`); ckMode = 'ai'; aiImg = q.img || QIMG[q.id] || 'sample'; aiDraft = aiDraftFor(q.part, q.proc); }
  else if (b.id === 'aiApply') { const n = aiDraft.filter(it => it.use).length; applyItems(aiDraft); toast(`${n} 項目を登録しました。次からこの品番×工程はタブレットで入力できます（紙はいりません）`); }
  else if (d.samplephoto) { f.photos = [...(f.photos || []), { id: 'p' + Date.now(), kind: d.samplephoto, src: samplePhoto(d.samplephoto, f.part, f.proc) }]; toast(`${d.samplephoto}の写真（見本）を付けました`); }
  else if (d.delphoto) { f.photos = f.photos.filter(x => x.id !== d.delphoto); if (ocrOpen === d.delphoto) ocrOpen = null; }
  else if (d.ocr) ocrOpen = ocrOpen === d.ocr ? null : d.ocr;
  else if (d.ocrclose) ocrOpen = null;
  else if (d.ocrapply) { const o = ocrMock(currentItems(), f.part, f.proc); Object.assign(f.values, o.fills); ocrOpen = null; toast('読み取った値を入れました。紙と見比べて確かめてください'); }
  else if (d.sendpaper) { QUEUE.push({ id: 'q' + Date.now(), part: f.part, proc: f.proc, emp: f.emp || '（担当なし）', time: nowHM() }); saveQueue(); toast('管理者に送りました。今日は紙のシートに書いてください'); }
  else if (b.id === 'closeCk') masterEdit = null;
  else if (b.id === 'addItem') {
    const list = CHECKS[masterEdit] = CHECKS[masterEdit] || [];
    list.push(N(Math.max(0, ...list.map(x => x.n)) + 1, '新しい項目', '', 0, -0.1, 0.1, 0.01, 'ノギス'));
    saveMaster();
  }
  else if (d.delitem !== undefined) { CHECKS[masterEdit].splice(+d.delitem, 1); saveMaster(); }
  else if (b.id === 'resetAll') {
    if (!confirm('この端末の決まり・チェック項目・日報・出勤を最初の状態に戻しますか？')) return;
    ['kn-routes', 'kn-checks', 'kn-reports', 'kn-att', 'kn-draft', 'kn-queue'].forEach(LS.del);
    ROUTES = clone(DEFAULT_ROUTES); CHECKS = clone(DEFAULT_CHECKS); reports = SEED(); ATT = {}; masterEdit = null;
    QUEUE = [{ id: 'q1', part: '7C22031150', proc: 'K', emp: '中村 光', time: '09:40' }];
    FILTERS.master = {}; toast('最初の状態に戻しました');
  }
  else return;
  render();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.num) {
    f.values[t.dataset.num] = t.value;
    const it = currentItems().find(i => i.n === +t.dataset.num), j = judge(it, t.value);
    const badge = $('#j' + it.n); badge.className = `badge b-${j}`; badge.textContent = j === '未' ? '未確認' : j;
    $('#dv' + it.n).textContent = devText(it, t.value);
    t.classList.remove('untouched');
    $('#drawingBox').innerHTML = drawingSvg(f.part, currentItems(), f.values) + `<div class="cap">${f.part} ${PARTS[f.part].name}　青い番号が今回のチェック項目</div>`;
    LS.set('kn-draft', f);
  } else if (t.id === 'qty' || t.id === 'ngQty') { f[t.id] = parseInt(t.value) || 0; LS.set('kn-draft', f); }
  else if (t.id === 'memo') { f.memo = t.value; LS.set('kn-draft', f); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'hours') { planHours = +t.value; render(); }
  else if (t.dataset.move) { if (moveOrder(t.dataset.move, undefined, t.value)) toast('設備を変えて計算し直しました'); render(); }
  else if (t.dataset.td) {
    const [i, field] = t.dataset.td.split('|');
    tplDraft[+i][field] = field === 'use' ? t.checked : t.value;
    if (field === 'use') render();
  }
  else if (t.id === 'copySrc') { copyFrom = t.value || null; render(); }
  else if (t.id === 'aiFile' && t.files[0]) { aiImg = URL.createObjectURL(t.files[0]); aiDraft = aiDraftFor(...masterEdit.split('|')); render(); }
  else if (t.dataset.photo && t.files.length) {
    const kind = t.dataset.photo;
    Promise.all([...t.files].map(fl => shrinkImage(fl))).then(srcs => {
      f.photos = [...(f.photos || []), ...srcs.map((src, i) => ({ id: 'p' + Date.now() + i, kind, src }))];
      toast(`${kind}の写真を${srcs.length}枚付けました`); render();
    });
  }
  else if (t.id === 'paperFile' && t.files[0]) {
    const id = 'q' + Date.now();
    QIMG[id] = URL.createObjectURL(t.files[0]);
    QUEUE.push({ id, part: f.part, proc: f.proc, emp: f.emp || '（担当なし）', time: nowHM() }); saveQueue();
    toast('写真を管理者に送りました。今日は紙のシートに書いてください'); render();
  }
  else if (t.dataset.ad) {
    const [i, field] = t.dataset.ad.split('|'), it = aiDraft[+i];
    if (field === 'use' || field === 'checked') it[field] = t.checked;
    else if (['nom', 'tm', 'tp'].includes(field)) { let v = parseFloat(t.value) || 0; if (field === 'tm') v = -Math.abs(v); if (field === 'tp') v = Math.abs(v); it[field] = v; it.checked = true; }
    else it[field] = t.value;
    render();
  }
  else if (t.dataset.ce) {
    const [i, field] = t.dataset.ce.split('|'), it = CHECKS[masterEdit][+i];
    let v = t.value;
    if (['n', 'nom', 'tm', 'tp', 'step', 'warn'].includes(field)) v = parseFloat(v) || 0;
    if (field === 'tm') v = -Math.abs(v);
    if (field === 'tp') v = Math.abs(v);
    it[field] = v;
    if (field === 'type' && v === 'num' && it.nom === undefined) Object.assign(it, { nom: 0, tm: -0.1, tp: 0.1, step: 0.01, warn: 15 });
    saveMaster(); render(); toast('保存しました。タブレットにもすぐ反映されます');
  }
});

const clearOver = () => document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
document.addEventListener('dragstart', e => {
  const l = e.target.closest && e.target.closest('[data-lane]');
  if (!l) return;
  dragId = l.dataset.lane; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); l.classList.add('dragging');
});
document.addEventListener('dragover', e => {
  const t = e.target.closest && e.target.closest('[data-lane],[data-eqrow]');
  if (!t || !dragId) return;
  e.preventDefault(); clearOver(); t.classList.add('over');
});
document.addEventListener('drop', e => {
  const t = e.target.closest && e.target.closest('[data-lane],[data-eqrow]');
  clearOver();
  if (!t || !dragId) return;
  e.preventDefault();
  const target = t.dataset.lane || undefined;
  if (target !== dragId && moveOrder(dragId, target, t.dataset.eq)) { render(); toast('順番を入れ替えて計算し直しました'); }
  dragId = null;
});
document.addEventListener('dragend', () => { clearOver(); dragId = null; document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });

// ---------- 起動 ----------
(() => {
  const q = new URLSearchParams(location.search);
  const draft = LS.get('kn-draft', null);
  if (q.get('part')) {
    if (draft && draft.part === q.get('part') && draft.proc === (q.get('proc') || draft.proc)) { f = { ...blankF(), ...draft }; toast('途中の入力を戻しました'); }
    else scan(q.get('part'), q.get('proc'), false);
  } else if (draft && draft.part) { f = { ...blankF(), ...draft }; toast('途中の入力を戻しました'); }
  view = 'input';
  render();
})();
</script>
</body>
</html>
