<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日報・チェック・生産管理 プロトタイプ</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --line: #d1d5db; --text: #1f2937; --sub: #6b7280;
    --accent: #1d4ed8; --accent-bg: #dbeafe;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7; --ng: #b91c1c; --ng-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif; font-size: 15px; }
  header { background: #111827; color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  header h1 { font-size: 16px; font-weight: 500; margin: 0; }
  header small { color: #9ca3af; font-size: 12px; }
  .switch { display: flex; flex-wrap: wrap; background: #1f2937; border-radius: 10px; padding: 4px; gap: 4px; }
  .switch button { border: 0; background: transparent; color: #d1d5db; padding: 10px 14px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
  .switch button.on { background: #fff; color: #111827; font-weight: 500; }
  main { max-width: 1160px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; font-weight: 500; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 { font-size: 15px; font-weight: 500; margin: 18px 0 8px; }
  .step { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; align-items: center; justify-content: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 14px; font: inherit; cursor: pointer; min-height: 46px; text-align: left; color: var(--text); }
  .chip small { display: block; color: var(--sub); font-size: 12px; }
  .chip.on { border-color: var(--accent); background: var(--accent-bg); color: #1e3a8a; font-weight: 500; }
  .chip.sm { min-height: 38px; padding: 6px 12px; }
  .chip:disabled { opacity: .35; cursor: default; }
  .chip.dark { background: #111827; color: #fff; border-color: #111827; }
  .group-label { font-size: 13px; color: var(--sub); margin: 12px 0 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row.chk { grid-template-columns: 0.85fr 1.35fr; }
  @media (max-width: 860px) { .row, .row.chk { grid-template-columns: 1fr; } }
  .drawing { border: 1px solid var(--line); border-radius: 10px; background: #fcfcfd; padding: 8px; align-self: start; }
  .drawing svg { width: 100%; height: auto; display: block; }
  .drawing .cap { font-size: 12px; color: var(--sub); padding: 4px 4px 0; }
  .ball { display: inline-flex; flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); font-weight: 500; align-items: center; justify-content: center; font-size: 14px; }
  .spec { font-size: 12px; color: var(--sub); }
  .note { font-size: 13px; color: var(--sub); line-height: 1.7; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .b-OK { background: var(--ok-bg); color: var(--ok); } .b-注意 { background: var(--warn-bg); color: var(--warn); }
  .b-NG { background: var(--ng-bg); color: var(--ng); } .b-未 { background: #f3f4f6; color: var(--sub); }
  .b-副 { background: #ede9fe; color: #5b21b6; } .b-外 { background: var(--warn-bg); color: var(--warn); }
  .it { border-top: 1px solid #e5e7eb; padding: 12px 4px; }
  .it-head { display: flex; align-items: center; gap: 10px; }
  .it-name { flex: 1; }
  .it-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 0 38px; }
  .adj { min-width: 64px; height: 50px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font: inherit; cursor: pointer; color: var(--text); }
  .adj.big { background: #f3f4f6; }
  .adj:active { background: var(--accent-bg); }
  input.num { width: 130px; font: inherit; font-size: 20px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; text-align: right; }
  input.num.untouched { color: #9ca3af; }
  .nomb { min-height: 50px; }
  .dev { font-size: 13px; color: var(--sub); }
  .okng { display: flex; gap: 6px; }
  .okng button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; min-width: 80px; }
  .okng button.on.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 500; }
  .okng button.on.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); font-weight: 500; }
  .ngpanel { border: 2px solid var(--ng); background: var(--ng-bg); color: #7f1d1d; border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .ngpanel button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 0; cursor: pointer; }
  .ngpanel .call { background: var(--ng); color: #fff; } .ngpanel .re { background: #fff; color: var(--ng); border: 1px solid var(--ng); }
  .stepper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .stepper button { width: 60px; height: 54px; font-size: 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .stepper input { width: 96px; font-size: 24px; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; }
  textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; min-height: 60px; }
  .who { border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: var(--accent-bg); color: #1e3a8a; font-size: 17px; }
  .who.warn { background: var(--warn-bg); color: #78350f; }
  .submit { width: 100%; font: inherit; font-size: 19px; font-weight: 500; padding: 18px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; }
  .err { color: var(--ng); font-size: 14px; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 12px 20px; border-radius: 10px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .kpi .v { font-size: 26px; font-weight: 500; } .kpi .l { font-size: 12px; color: var(--sub); }
  .kpi.alert .v { color: var(--ng); }
  .ai { border-left: 4px solid #0f766e; border-radius: 0; background: #f0fdfa; }
  .ai ul { margin: 0; padding-left: 20px; line-height: 1.8; }
  .ai .tag { font-size: 11px; color: #0f766e; border: 1px solid #0f766e; border-radius: 4px; padding: 1px 6px; font-weight: 400; }
  .tablewrap { overflow-x: auto; }
  table.list { width: 100%; border-collapse: collapse; min-width: 760px; }
  table.list th { text-align: left; font-size: 12px; color: var(--sub); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.list td { padding: 9px 8px; border-bottom: 1px solid #eef0f3; vertical-align: middle; }
  table.list tr.click { cursor: pointer; } table.list tr.click:hover { background: #f9fafb; }
  table.list tr.sel { background: var(--accent-bg); }
  .slipchip { display: inline-flex; align-items: center; gap: 6px; max-width: 260px; font: inherit; font-size: 13px; padding: 3px 8px 3px 3px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; text-align: left; }
  .slipchip img { width: 34px; height: 34px; object-fit: cover; border-radius: 5px; }
  .slipchip span:not(.slipk) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slipchip small { color: var(--sub); }
  .slipk { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 5px; background: #eef2ff; color: #3730a3; font-size: 11px; font-weight: 700; flex: none; }
  .slip-ov { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); z-index: 50; display: grid; place-items: center; padding: 16px; }
  .slip-box { background: #fff; border-radius: 14px; padding: 18px; width: min(900px, 100%); max-height: 92vh; overflow: auto; }
  table.sliptab { min-width: 0; } table.sliptab th, table.sliptab td { font-size: 13px; padding: 5px 8px; border: 1px solid #e5e7eb; }
  table.mvtab { min-width: 0; }
  table.mvtab th, table.mvtab td { padding: 4px 7px; font-size: 13px; white-space: nowrap; }
  table.mvtab th small, table.mvtab td small { color: var(--sub); font-weight: 400; }
  table.mvtab .r { text-align: right; font-variant-numeric: tabular-nums; }

  table.mvtab tr.mv-st td.mv-today { background: #dbeafe; }
  table.mvtab .mv-part, table.mvtab .mv-proc { vertical-align: top; background: #fff; }
  table.mvtab .mv-k { font-size: 12px; }
  .mv-in { color: #15803d; } .mv-out { color: #b91c1c; } .mv-neg { color: var(--ng); }
  .mv-btn { flex: 1; min-width: 180px; font: inherit; font-size: 22px; font-weight: 700; padding: 16px; border-radius: 12px; cursor: pointer; color: #fff; border: 0; }
  .mv-btn-in { background: #15803d; } .mv-btn-out { background: #b91c1c; }
  .ngrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid var(--ng-bg); background: #fff7f7; border-radius: 10px; margin-bottom: 8px; }
  .ngrow select, .ngrow button, .mini, .addrow select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .ngrow button, .mini.dark { background: var(--text); color: #fff; border: 0; cursor: pointer; }
  .mini { cursor: pointer; }

  .banner { background: var(--warn-bg); color: #78350f; font-size: 13px; padding: 8px 16px; text-align: center; }

  .filt .fl { font-size: 13px; color: var(--sub); }
  .filt .fl b { color: var(--accent); font-weight: 500; }
  .mcols { display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mcol { border-right: 1px solid var(--line); background: #fff; min-height: 220px; }

  .mhead b { color: var(--text); font-weight: 500; }
  .mitem { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 6px; border: 0; border-bottom: 1px solid #f1f2f4; background: #fff; padding: 10px 12px; font: inherit; font-size: 14px; text-align: left; cursor: pointer; color: var(--text); }

  .mitem small { display: block; color: var(--sub); font-size: 11px; font-weight: 400; }
  .cnt { font-size: 11px; color: var(--sub); background: #f3f4f6; border-radius: 999px; padding: 1px 7px; flex: none; }
  .warnbox { background: var(--warn-bg); color: #78350f; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.8; margin-bottom: 12px; }
  .addrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  table.ck input, table.ck select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; min-width: 60px; }
  table.ck input:disabled { background: #f3f4f6; color: #9ca3af; }
  table.ck td { padding: 6px 4px; }

  .scanframe { width: 140px; height: 140px; margin: 0 auto; border: 3px solid var(--accent); border-radius: 16px; position: relative; }
  .scanframe span { position: absolute; left: 12px; right: 12px; top: 50%; height: 2px; background: #ef4444; }
  .partHead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .big { font-size: 26px; font-weight: 500; letter-spacing: .02em; }
  .assign { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0 8px; }
  @media (max-width: 720px) { .assign { grid-template-columns: repeat(2, 1fr); } }

  .assign b { display: block; font-size: 19px; font-weight: 500; color: #1e3a8a; }
  .linkbtn { border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; padding: 0 4px; }
  details.anyemp summary { cursor: pointer; color: var(--accent); margin-top: 12px; font-size: 14px; }
  .qrprint { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 720px) { .qrprint { grid-template-columns: 1fr; } }
  .qrlabel { display: flex; gap: 14px; align-items: center; border: 1px dashed #9ca3af; border-radius: 8px; padding: 14px; background: #fff; }
  .url { font-size: 10px; color: var(--sub); word-break: break-all; margin-top: 6px; }

  .g-eq { background: #f9fafb; }

// 決まり（ルーティング）：係 → 人 → 設備 → 工程 → 品番。1行＝「この人が、この設備で、この品番のこの工程をやる」

const N = (n, name, label, nom, tm, tp, step, tool) => ({ n, name, type: 'num', label, nom, tm, tp, step, warn: 15, tool });
const O = (n, name, label, tool) => ({ n, name, type: 'ok', label, tool });
const DEFAULT_CHECKS = {

                     N(3, '全長', '85.0', 85, -0.1, 0.1, 0.05, 'ノギス'), O(4, '面取り', 'C1', '目視'), O(5, 'キズ・打痕', 'なきこと', '目視')],

                      N(3, '振れ', '0.02 以下', 0, 0, 0.02, 0.001, 'ダイヤルゲージ')],

};
let ROUTES = LS.get('kn-routes', null) || clone(DEFAULT_ROUTES);
let CHECKS = LS.get('kn-checks', null) || clone(DEFAULT_CHECKS);
function saveMaster() {

  LS.set('kn-procs', PROCESSES); LS.set('kn-rates', RATES); LS.set('kn-ct', CT);

const itemsFor = (part, proc) => CHECKS[`${part}|${proc}`] || [];

function renamePart(oldC, newC) {

  ORDERS.forEach(o => { if (o.part === oldC) o.part = newC; });

const procsOf = part => {
  const used = new Set(ROUTES.filter(r => r.part === part).map(r => r.proc));
  const order = PARTS[part].route;
  return [...used].sort((a, b) => ((order.indexOf(a) + 1) || 99) - ((order.indexOf(b) + 1) || 99) || PROC_ORDER.indexOf(a) - PROC_ORDER.indexOf(b));
};
const mainRoute = (part, proc) => ROUTES.find(r => r.part === part && r.proc === proc && r.main) || ROUTES.find(r => r.part === part && r.proc === proc);

// ---------- 寸法と判定 ----------
const decOf = step => (String(step).split('.')[1] || '').length;
const trimNum = x => String(parseFloat((+x).toFixed(6)));
const tolTxt = x => Math.abs(x) < 1e-12 ? '0' : (x > 0 ? '+' : '−') + trimNum(Math.abs(x));
const specText = it => it.type === 'ok' ? it.label : `${it.label}（${tolTxt(it.tm)} / ${tolTxt(it.tp)}）`;
function judge(it, v) {
  if (v === undefined || v === '' || v === null) return '未';

function drawingSvg(part, items, values) {

  if (!d) return `<svg viewBox="0 0 360 225" role="img" aria-label="図面なし"><rect x="10" y="10" width="340" height="205" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="6 4"/><text x="180" y="108" text-anchor="middle" font-size="14" fill="#6b7280">図面はまだ登録されていません</text><text x="180" y="132" text-anchor="middle" font-size="12" fill="#9ca3af">（本番では図面の PDF・写真を品番に付けます）</text></svg>`;
  const active = new Set(items.map(i => i.n));

// ---------- 日報（見本データ） ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function shrinkImage(file, max = 900) {
  return new Promise(resolve => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => resolve(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const LEVELS = [['team', '係'], ['emp', '人'], ['equip', '設備'], ['proc', '工程'], ['part', '品番']];
function cascade(rows, sel) {
  const opts = {};
  let cur = rows;
  LEVELS.forEach(([k]) => {
    const cnt = {};
    cur.forEach(r => { cnt[r[k]] = (cnt[r[k]] || 0) + 1; });
    opts[k] = Object.entries(cnt).sort((a, b) => ORDER_OF[k].indexOf(a[0]) - ORDER_OF[k].indexOf(b[0]));
    if (sel[k] != null) cur = cur.filter(r => r[k] === sel[k]);
  });
  return { opts, rows: cur, total: rows.length };
}
function prune(rows, sel) {
  let cur = rows;
  LEVELS.forEach(([k]) => {
    if (sel[k] == null) return;
    if (!cur.some(r => r[k] === sel[k])) sel[k] = null;
    else cur = cur.filter(r => r[k] === sel[k]);
  });
}
function autofill(rows, sel) {
  let cur = rows;
  LEVELS.forEach(([k]) => {
    if (sel[k] == null) { const vs = [...new Set(cur.map(r => r[k]))]; if (vs.length === 1) sel[k] = vs[0]; }
    if (sel[k] != null) cur = cur.filter(r => r[k] === sel[k]);
  });
}

const SETUP_MIN = 60;
const HORIZON = 15;
const ST = { '間に合う': 'OK', 'ぎりぎり': '注意', '遅れ': 'NG' };
const BAR = { '間に合う': '#86efac', 'ぎりぎり': '#fcd34d', '遅れ': '#fca5a5' };
const PROC_COLOR = ['#93c5fd', '#a5b4fc', '#fcd34d', '#86efac', '#f9a8d4', '#fdba74', '#67e8f9'];
const procColor = p => PROC_COLOR[Math.max(0, PROC_ORDER.indexOf(p)) % PROC_COLOR.length];
const DEFAULT_ORDERS = [

  { id: 'J-1007', cust: 'A社', part: '7C22031150', qty: 350, done: { LNC2: 350 }, D: 5 },
  { id: 'J-1008', cust: 'B社', part: '3B51120040', qty: 150, done: {}, D: 14 },
].sort((a, b) => a.D - b.D || a.id.localeCompare(b.id)).map((o, i) => ({ ...o, prio: i + 1 }));
let ORDERS = LS.get('kn-orders', null) || clone(DEFAULT_ORDERS);
const saveOrders = () => LS.set('kn-orders', ORDERS);
let planHours = 8, planView = 'list', planF = { team: '', emp: '', part: '' }, planDecisions = [], addOrd = null, dragId = null;

function addWorkdays(n) {
  const d = new Date(); let k = 0;
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  while (k < n) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) k++; }
  return d;
}
function workdaysUntil(dateStr) {
  const target = new Date(dateStr + 'T00:00:00'), d = new Date();
  d.setHours(0, 0, 0, 0);
  let n = 0;
  while (d <= target) { if (d.getDay() !== 0 && d.getDay() !== 6) n++; d.setDate(d.getDate() + 1); }
  return n;
}
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const dayDate = x => addWorkdays(Math.max(0, Math.ceil(x - 1e-9) - 1));
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function todayRate(eq) { return reports.filter(r => r.equip === eq).reduce((s, r) => s + r.qty * (CT[`${r.part}|${r.proc}`] || 0), 0) / 480; }
const stepEq = (o, proc) => (o.eq && o.eq[proc]) || (mainRoute(o.part, proc) || {}).equip || (PROCESSES[proc] || [])[0];

function planAll(orders = ORDERS, hours = planHours) {
  const busy = {};
  return orders.filter(o => PARTS[o.part]).slice().sort((a, b) => a.prio - b.prio).map(o => {
    let t = 0;
    const steps = PARTS[o.part].route.map(proc => {
      const eq = stepEq(o, proc), rem = Math.max(0, o.qty - ((o.done || {})[proc] || 0));
      if (!rem || !eq) return { proc, eq, rem, start: t, end: t, setupEnd: t };
      const cap = hours * 60 * (RATES[eq] ?? 0.7);
      const dur = (SETUP_MIN + rem * (CT[`${o.part}|${proc}`] || 5)) / cap;
      const b = (busy[eq] = busy[eq] || []).sort((x, y) => x[0] - y[0]);
      let start = t;
      for (const [s0, e0] of b) { if (start + dur <= s0 + 1e-9) break; if (e0 > start) start = e0; }
      b.push([start, start + dur]);
      t = start + dur;
      return { proc, eq, rem, start, end: t, setupEnd: start + SETUP_MIN / cap };
    });
    return { ...o, steps, end: t, slack: o.D - t, status: t > o.D + 1e-9 ? '遅れ' : o.D - t < 1 ? 'ぎりぎり' : '間に合う' };
  });
}
const lateCount = pl => pl.filter(x => x.status === '遅れ').length;
const prioIds = () => ORDERS.slice().sort((a, b) => a.prio - b.prio).map(o => o.id);
function renumber(ids) { ids.forEach((id, i) => { const o = ORDERS.find(x => x.id === id); if (o) o.prio = i + 1; }); }
function movePrio(id, targetId) {
  const before = prioIds(), from = before.indexOf(id), rest = before.filter(x => x !== id);
  let at = targetId ? rest.indexOf(targetId) : rest.length;
  if (targetId && from < before.indexOf(targetId)) at += 1;
  rest.splice(at, 0, id); renumber(rest);
}
function orderEmps(o) { return (PARTS[o.part] ? PARTS[o.part].route : []).map(p => (mainRoute(o.part, p) || {}).emp).filter(Boolean); }
function visibleOrder(o) {
  const emps = orderEmps(o);
  return (!planF.team || emps.some(e => teamOf(e) === planF.team)) && (!planF.emp || emps.includes(planF.emp)) && (!planF.part || o.part === planF.part);
}
const withPrio = ids => ORDERS.map(x => ({ ...x, prio: ids.indexOf(x.id) + 1 }));

function planOptions(pl) {
  const L0 = lateCount(pl);
  return pl.filter(o => o.status === '遅れ' && visibleOrder(o)).map(o => {
    const opts = [];
    const test = (orders, hours) => { const p = planAll(orders, hours); const me = p.find(x => x.id === o.id); return { ok: me.status !== '遅れ', late: lateCount(p), me }; };
    const res = r => `${o.id} は ${md(dayDate(r.me.end))} に終わる見込み（遅れ ${L0} 件 → ${r.late} 件）`;
    const cands = [];
    o.steps.filter(s => s.rem > 0).forEach(s => {
      pl.forEach(x => x.steps.filter(y => y.eq === s.eq && y.rem > 0 && y.start <= s.start + 1e-9).forEach(y => {
        (PROCESSES[y.proc] || []).filter(e => e !== y.eq).forEach(e => cands.push({ id: x.id, proc: y.proc, to: e }));
      }));
    });
    for (const c of cands) {
      const r = test(ORDERS.map(x => x.id === c.id ? { ...x, eq: { ...(x.eq || {}), [c.proc]: c.to } } : x), planHours);
      if (r.ok && r.late < L0) {
        opts.push({ label: c.id === o.id ? `${o.id} の工程 ${c.proc} を ${c.to} に移す` : `先に流れる ${c.id} の工程 ${c.proc} を ${c.to} に移す`, result: res(r),
          apply: () => { const x = ORDERS.find(y => y.id === c.id); x.eq = { ...(x.eq || {}), [c.proc]: c.to }; } });
        break;
      }
    }
    for (const h of [9, 10].filter(h => h > planHours)) {
      const r = test(ORDERS, h);
      if (r.ok) { opts.push({ label: `残業して1日${h}時間にする（+${h - planHours}時間）`, result: res(r), apply: () => { planHours = h; } }); break; }
    }
    const ids = prioIds(), idx = ids.indexOf(o.id);
    for (let k = idx - 1; k >= 0; k--) {
      const t = ids.filter(x => x !== o.id); t.splice(k, 0, o.id);
      const r = test(withPrio(t), planHours);
      if (r.ok && r.late < L0) { opts.push({ label: `${o.id} を ${ids[k]} より先に流す`, result: res(r), apply: () => renumber(t) }); break; }
    }
    const top = [o.id, ...ids.filter(x => x !== o.id)];
    return { o, opts: opts.slice(0, 3), earliest: test(withPrio(top), planHours).me.end };
  });
}

function addOrderPreview() {
  if (!addOrd || !addOrd.part || !(addOrd.qty > 0) || !addOrd.due) return '<p class="note">品番・数量・納期を入れると、入るかどうかがここに出ます。</p>';
  const D = workdaysUntil(addOrd.due);
  if (D < 1) return '<p class="err">納期が今日より前です。</p>';
  const missCt = PARTS[addOrd.part].route.filter(p => !CT[`${addOrd.part}|${p}`]);
  const base = planAll(), L0 = lateCount(base);
  const prio = Math.max(0, ...ORDERS.filter(o => o.D <= D).map(o => o.prio)) + 0.5;
  const newO = { id: '新しい受注', part: addOrd.part, qty: addOrd.qty, done: {}, D, prio };
  const pl = planAll([...ORDERS, newO]), me = pl.find(x => x.id === newO.id), late2 = lateCount(pl.filter(x => x.id !== newO.id));
  const flow = me.steps.map(s => `${s.proc}（${eqLabel(s.eq)}）${md(dayDate(s.start + 0.001))}〜${md(dayDate(s.end))}`).join(' → ');
  let html;
  if (me.status !== '遅れ') {
    html = `<div class="okbox"><b>この納期で入ります。</b>終わる見込み ${md(dayDate(me.end))}（納期 ${md(addWorkdays(D - 1))}・余裕 ${Math.floor(me.slack)}日）${late2 > L0 ? `<br>ただし、ほかの受注 ${late2 - L0} 件が遅れるようになります。` : ''}</div>`;
  } else {
    const topPl = planAll([...ORDERS, { ...newO, prio: 0 }]), top = topPl.find(x => x.id === newO.id), late3 = lateCount(topPl.filter(x => x.id !== newO.id));
    html = `<div class="ngbox"><b>この納期では入りません。</b>終わる見込み ${md(dayDate(me.end))}（納期 ${md(addWorkdays(D - 1))}）。<br>
      いちばん先に流すと ${md(dayDate(top.end))} に終わります${late3 > L0 ? `が、ほかの受注 ${late3 - L0} 件が遅れます` : ''}。お客様と納期を相談するか、残業を検討してください。</div>`;
  }
  return html + `<p class="note">流れの見込み：${flow}${missCt.length ? `<br>⚠ 工程 ${missCt.join('・')} のサイクルタイムが未登録なので、1個5分で計算しています（「品番・マスター」で入れられます）。` : ''}</p>`;
}


// ---------- 日ごとの生産数（実績＋見込み） ----------
let dailyBreak = 'part', dailyProc = '';
const PAST_DAYS = 10, FUTURE_DAYS = 14;
const CAT = ['#2563eb', '#f59e0b', '#10b981', '#8b5cf6', '#ef4444', '#06b6d4', '#84cc16', '#ec4899', '#64748b'];
function workdayBack(n) {
  const d = new Date(); let k = 0;
  while (k < n) { d.setDate(d.getDate() - 1); if (d.getDay() !== 0 && d.getDay() !== 6) k++; }
  return d;
}
function hashRand(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; }
// これまでの実績（見本）：日付と設備から決まる架空の数。プロトタイプでは日報の履歴を持っていないため
function historyRows() {
  const out = [];
  for (let i = PAST_DAYS; i >= 1; i--) {
    const d = workdayBack(i), day = -i;
    EQUIPS.forEach(eq => {
      const routes = ROUTES.filter(r => r.equip === eq && r.main && PARTS[r.part] && !PARTS[r.part].archived);
      if (!routes.length) return;
      const key = `${d.getMonth() + 1}-${d.getDate()}-${eq}`;
      const r = routes[Math.floor(hashRand(key + 'p') * routes.length)];
      const ct = CT[`${r.part}|${r.proc}`] || 5;
      const qty = eq === '-' ? Math.round(50 + hashRand(key) * 60)
        : Math.round(8 * 60 * (RATES[eq] ?? 0.7) * (0.7 + hashRand(key) * 0.35) / ct);
      out.push({ day, part: r.part, proc: r.proc, equip: eq, emp: r.emp, qty, kind: 'act' });
    });
  }
  return out;
}
function todayRows() { return reports.map(r => ({ day: 0, part: r.part, proc: r.proc, equip: r.equip, emp: r.emp, qty: r.qty, kind: 'act' })); }
function planDailyRows(pl) {
  const out = [];
  pl.forEach(o => o.steps.forEach(s => {
    if (!(s.rem > 0)) return;
    const a = s.setupEnd, b = s.end, rate = s.rem / Math.max(1e-6, b - a);
    for (let d = Math.max(1, Math.floor(a)); d < Math.min(FUTURE_DAYS + 1, Math.ceil(b)); d++) {
      const ov = Math.min(b, d + 1) - Math.max(a, d);
      if (ov > 0) out.push({ day: d, part: o.part, proc: s.proc, equip: s.eq, emp: (mainRoute(o.part, s.proc) || {}).emp, qty: ov * rate, kind: 'plan', order: o.id });
    }
  }));
  return out;
}
const dayDateOf = d => d < 0 ? workdayBack(-d) : addWorkdays(d);
function dailyHtml(pl, fixedPart) {
  const keep = r => (fixedPart ? r.part === fixedPart : (!planF.team || teamOf(r.emp) === planF.team) && (!planF.emp || r.emp === planF.emp) && (!planF.part || r.part === planF.part)) && (!dailyProc || r.proc === dailyProc);
  const rows = [...historyRows(), ...todayRows(), ...planDailyRows(pl)].filter(keep);
  const keyOf = r => dailyBreak === 'part' ? r.part : dailyBreak === 'equip' ? r.equip : r.proc;
  const labelOf = k => dailyBreak === 'part' ? `${k} ${PARTS[k] ? PARTS[k].name : ''}` : dailyBreak === 'equip' ? eqLabel(k) : `工程 ${k}`;
  const order = dailyBreak === 'part' ? Object.keys(PARTS) : dailyBreak === 'equip' ? EQUIPS : PROC_ORDER;
  const keys = order.filter(k => rows.some(r => keyOf(r) === k));
  const color = k => dailyBreak === 'proc' ? procColor(k) : CAT[order.indexOf(k) % CAT.length];
  const days = []; for (let d = -PAST_DAYS; d <= FUTURE_DAYS; d++) days.push(d);
  const sum = {}; rows.forEach(r => { const k = `${r.day}|${keyOf(r)}`; sum[k] = (sum[k] || 0) + r.qty; });
  const total = d => keys.reduce((t, k) => t + (sum[`${d}|${k}`] || 0), 0);
  const maxT = Math.max(10, ...days.map(total));
  const step = maxT > 800 ? 200 : maxT > 400 ? 100 : maxT > 160 ? 50 : maxT > 60 ? 20 : 10;
  const top = Math.ceil(maxT / step) * step;
  const W = 1000, H = 330, ml = 46, mr = 10, mt = 26, mb = 46, cw = (W - ml - mr) / days.length, bw = cw * 0.68;
  const y = v => mt + (H - mt - mb) * (1 - v / top);
  let svg = '';
  for (let v = 0; v <= top; v += step) svg += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${ml - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6b7280">${v}</text>`;
  const x0 = i => ml + cw * i + (cw - bw) / 2;
  const ti = days.indexOf(0);
  svg += `<rect x="${ml + cw * ti}" y="${mt - 6}" width="${cw}" height="${H - mt - mb + 6}" fill="#dbeafe" opacity=".45"/>`;
  svg += `<rect x="${ml + cw * (ti + 1)}" y="${mt - 6}" width="${cw * FUTURE_DAYS}" height="${H - mt - mb + 6}" fill="#f8fafc"/>`;
  days.forEach((d, i) => {
    let acc = 0;
    keys.forEach(k => {
      const v = sum[`${d}|${k}`] || 0; if (v <= 0) return;
      const yt = y(acc + v), yb = y(acc);
      svg += `<rect x="${x0(i)}" y="${yt}" width="${bw}" height="${Math.max(0.5, yb - yt)}" fill="${color(k)}" ${d > 0 ? 'fill-opacity=".38" stroke="' + color(k) + '" stroke-dasharray="3 2"' : ''}><title>${md(dayDateOf(d))} ${labelOf(k)}：${Math.round(v)}個${d > 0 ? '（見込み）' : ''}</title></rect>`;
      acc += v;
    });
    const t = total(d);
    if (t > 0) svg += `<text x="${x0(i) + bw / 2}" y="${y(t) - 5}" text-anchor="middle" font-size="10.5" fill="${d > 0 ? '#6b7280' : '#1f2937'}" font-weight="${d === 0 ? 700 : 400}">${Math.round(t)}</text>`;
    const dd = dayDateOf(d);
    svg += `<text x="${x0(i) + bw / 2}" y="${H - mb + 16}" text-anchor="middle" font-size="10.5" fill="${d === 0 ? '#1d4ed8' : '#6b7280'}" font-weight="${d === 0 ? 700 : 400}">${dd.getMonth() + 1}/${dd.getDate()}</text>`;
    svg += `<text x="${x0(i) + bw / 2}" y="${H - mb + 30}" text-anchor="middle" font-size="10" fill="#9ca3af">${WD[dd.getDay()]}</text>`;
  });
  svg += `<text x="${ml + cw * ti + cw / 2}" y="${mt - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">今日</text>`;
  svg += `<text x="${ml + cw * (ti + 1) + 4}" y="${mt - 10}" font-size="11" fill="#6b7280">この先の見込み →</text>`;
  svg += `<text x="${ml + 4}" y="${mt - 10}" font-size="11" fill="#6b7280">← これまでの実績</text>`;
  const avg = arr => arr.length ? Math.round(arr.reduce((a, d) => a + total(d), 0) / arr.length) : 0;
  const past = days.filter(d => d < 0), fut = days.filter(d => d > 0);
  const procs = PROC_ORDER.filter(p => rows.length || true);
  return `
    <div class="toolbar" style="margin-bottom:8px">
      <span class="spec">内訳</span>
      ${[['part', '品番'], ['equip', '設備'], ['proc', '工程']].map(([v, l]) => `<button class="chip sm ${dailyBreak === v ? 'on' : ''}" data-dbreak="${v}">${l}</button>`).join('')}
      <span class="spec" style="margin-left:12px">数える工程</span>
      <select id="dailyProc" class="fsel"><option value="">すべての工程（工程ごとに数えた合計）</option>${PROC_ORDER.map(q => `<option value="${q}" ${dailyProc === q ? 'selected' : ''}>工程 ${q} だけ</option>`).join('')}</select>
    </div>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
      <div class="kpi"><div class="v">${avg(past)}<span class="spec"> 個/日</span></div><div class="l">これまで ${PAST_DAYS}日の平均（実績）</div></div>
      <div class="kpi"><div class="v" style="color:#1d4ed8">${Math.round(total(0))}<span class="spec"> 個</span></div><div class="l">今日ここまで（日報から）</div></div>
      <div class="kpi"><div class="v" style="color:var(--sub)">${avg(fut)}<span class="spec"> 個/日</span></div><div class="l">この先 ${FUTURE_DAYS}日の平均（見込み）</div></div>
    </div>
    <div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:760px;height:auto;display:block" role="img" aria-label="日ごとの生産数">${svg}</svg></div>
    <div class="legend2" style="margin-top:6px">${keys.map(k => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:10px"><span style="width:14px;height:12px;border-radius:3px;background:${color(k)};display:inline-block"></span>${esc(labelOf(k))}</span>`).join('')}</div>
    <p class="note">濃い棒＝日報の実績、薄い点線の棒＝今の受注・流す順番・稼働率から計算した見込み。棒にマウスを乗せると内訳の数が出ます。<br>
    「すべての工程」は工程ごとに数えた合計なので、同じ品を LNC と BR で2回数えます。出来上がった数を見るときは、最後の工程（K）だけにしてください。<br>
    ※ プロトタイプでは、これまでの実績は見本の数です（本番では Airtable の日報から集計します）。</p>`;
}

function aiDraftFor(part, proc) {
  const base = DEFAULT_CHECKS[`${part}|${proc}`];
  let list;
  if (base && base.length) {
    list = clone(base).map(it => ({ ...it, conf: 'high' }));
    const low = list.find(it => it.type === 'num') || list[0];
    Object.assign(low, { conf: 'low', why: '手書きの許容差がかすれていて、読み切れていません。紙と見比べてください' });
  } else {
    list = [
      { ...O(1, 'キズ・打痕', 'なきこと', '目視'), conf: 'high' },
      { ...O(2, '刻印', '品番・ロット', '目視'), conf: 'high' },
      { ...N(3, '厚さ', 't25', 25, -0.05, 0.05, 0.01, '外側マイクロメータ'), conf: 'low', why: '「±0.05」か「±0.08」か読み切れていません。紙と見比べてください' },
    ];
  }
  return list.map(it => ({ ...it, use: true, checked: it.conf !== 'low' }));
}
function applyItems(list) {
  const cur = CHECKS[masterEdit] = CHECKS[masterEdit] || [];
  const fresh = cur.length === 0;
  let n = Math.max(0, ...cur.map(x => x.n));
  list.filter(it => it.use !== false).forEach(it => {
    const { use, conf, why, checked, ...rest } = it;
    cur.push({ ...rest, n: fresh ? rest.n : ++n });
  });
  QUEUE = QUEUE.filter(q => `${q.part}|${q.proc}` !== masterEdit); saveQueue();
  saveMaster(); ckMode = 'table'; tplDraft = null; aiDraft = null; aiImg = null;
}
function openEditor(key) {

// 異動の準備：担当ごとに「引き継ぐ／そのまま／外す」を決める
function startXfer(name, to) {
  const from = teamOf(name);
  const routes = ROUTES.filter(r => r.emp === name).map(r => {
    const others = ROUTES.filter(x => x.equip === r.equip && x.emp !== name).map(x => x.emp);
    const sameTeam = EMPLOYEES.filter(e => e.team === from && e.name !== name).map(e => e.name);
    const cand = others.find(n => sameTeam.includes(n)) || sameTeam[0] || others[0] || '';
    return { id: r.id, part: r.part, proc: r.proc, equip: r.equip, main: r.main, action: r.main && cand ? 'handover' : 'keep', target: cand };
  });
  xfer = { name, from, to, routes };
}
function xferSummary(x) {
  const c = a => x.routes.filter(r => r.action === a).length;
  return [c('handover') && `引き継ぎ ${c('handover')}件`, c('keep') && `そのまま ${c('keep')}件`, c('remove') && `外す ${c('remove')}件`].filter(Boolean).join('・') || '担当なし';
}
function applyXfer() {
  const x = xfer, e = EMPLOYEES.find(y => y.name === x.name), notes = [];
  x.routes.forEach(rt => {
    const r = ROUTES.find(y => y.id === rt.id);
    if (!r) return;
    const label = `${rt.part} ${PARTS[rt.part] ? PARTS[rt.part].name : ''} ${rt.proc}${rt.main ? '（主）' : ''}`;
    if (rt.action === 'remove') {
      ROUTES = ROUTES.filter(y => y.id !== r.id);
      if (r.main) { const n = ROUTES.find(y => y.part === r.part && y.proc === r.proc); if (n) n.main = true; }
      notes.push(`${label} を外す`);
    } else if (rt.action === 'handover') {
      const ex = ROUTES.find(y => y.part === r.part && y.proc === r.proc && y.emp === rt.target);
      if (ex) { if (r.main) { ROUTES.forEach(y => { if (y.part === r.part && y.proc === r.proc) y.main = false; }); ex.main = true; } ROUTES = ROUTES.filter(y => y.id !== r.id); }
      else r.emp = rt.target;
      notes.push(`${label} を ${rt.target} さんに引き継ぎ`);
    } else notes.push(`${label} はそのまま`);
  });
  e.team = x.to;
  const d = new Date();
  XFER_LOG.unshift({ date: `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`, time: nowHM(), name: x.name, from: x.from, to: x.to, notes });
  saveXferLog();
  commitMaster(`${x.name} さんを ${x.from} から ${x.to} に移しました（${xferSummary(x)}）`);
  Object.keys(FILTERS).forEach(k => { if (FILTERS[k].emp === x.name) FILTERS[k].team = x.to; });
  prune(routeRows(), FILTERS.master);
  if (planF.emp === x.name) planF.team = x.to;
  if (planF.team && !TEAMS.includes(planF.team)) planF = { team: '', emp: '', part: '' };
  if (f.emp === x.name) f.team = x.to;
  xfer = null;
}

function stepInfo(part, proc) {
  const routes = ROUTES.filter(r => r.part === part && r.proc === proc);
  const main = routes.find(r => r.main);
  const n = itemsFor(part, proc).length;
  return { proc, routes, main, n, equip: main ? main.equip : routes[0] ? routes[0].equip : (PROCESSES[proc] || [])[0], st: !main ? 'red' : n === 0 ? 'amber' : 'green' };
}
function partStatus(part) {
  const steps = PARTS[part].route.map(proc => stepInfo(part, proc));
  const issues = steps.filter(s => s.st !== 'green').length + (steps.length ? 0 : 1);
  return { steps, issues, ok: issues === 0 };
}
const ST_TXT = { green: '入力できる', amber: 'チェック項目なし', red: '主担当なし' };
function empOptions(equip, selected) {
  const users = [...new Set(ROUTES.filter(r => r.equip === equip).map(r => r.emp))];
  const opt = n => `<option value="${esc(n)}" ${n === selected ? 'selected' : ''}>${esc(n)}（${teamOf(n)}）</option>`;
  return `<option value="">担当を選ぶ</option>${users.length ? `<optgroup label="${eqLabel(equip)} を使っている人">${users.map(opt).join('')}</optgroup>` : ''}
    ${TEAMS.map(t => `<optgroup label="${t}">${EMPLOYEES.filter(e => e.team === t && !users.includes(e.name)).map(e => opt(e.name)).join('')}</optgroup>`).join('')}`;
}

    <div class="preview">${eItems.length ? eItems.map(it => itemRow(it, {}, true)).join('') : '<p class="note">項目がありません。上の「ひな形から作る」「似た品番から写す」「紙の写真から」で作れます。</p>'}</div>`;
  }
  return `<div class="modes">${MODES.map(([m, label]) => `<button class="${ckMode === m ? 'on' : ''}" data-ckmode="${m}">${label}</button>`).join('')}</div>${body}`;
}

    <div class="row3">
      <div><div class="group-label">使う設備</div><b>${[...new Set(s.routes.map(r => r.equip))].map(eqLabel).join('・') || eqLabel(s.equip)}</b>
        <div class="spec">設備は担当ごとに下で選びます。生産管理は★主担当の設備で計算します</div></div>
      <div><div class="group-label">サイクルタイム（1個あたり・分）</div><input class="fsel" type="number" step="any" min="0" data-ct="${key}" value="${CT[key] ?? ''}" placeholder="例 6" style="width:120px"><span class="spec"> 生産管理の計算に使います</span></div>

    </div>

    <div class="chips">${s.routes.map(r => `<span class="person ${r.main ? 'main' : ''}">${r.main ? '★ ' : ''}${r.emp}<small>${teamOf(r.emp)}</small>
      ${(PROCESSES[proc] || []).length > 1 ? `<select class="fsel mini-sel" data-routeeq="${r.id}" title="この人が使う設備">${PROCESSES[proc].map(e => `<option value="${e}" ${e === r.equip ? 'selected' : ''}>${eqLabel(e)}</option>`).join('')}</select>` : `<small>${eqLabel(r.equip)}</small>`}
      ${r.main ? '' : `<button class="mini" data-setmain="${r.id}">主担当にする</button>`}<button class="mini del" data-delroute="${r.id}">外す</button></span>`).join('') || '<span class="note">まだ担当がいません。下で足してください。</span>'}</div>
    <div class="addrow" style="margin-top:8px"><select class="fsel" id="stepAddEmp">${empOptions(s.equip)}</select>
      ${(PROCESSES[proc] || []).length > 1 ? `<span class="spec">が</span><select class="fsel" id="stepAddEq">${PROCESSES[proc].map(e => `<option value="${e}" ${e === s.equip ? 'selected' : ''}>${eqLabel(e)}</option>`).join('')}</select><span class="spec">で</span>` : ''}
      <button class="mini dark" data-stepaddemp="${key}">担当を足す</button></div>

function partCardHtml(part) {
  const { steps, issues, ok } = partStatus(part);
  const people = [...new Set(ROUTES.filter(r => r.part === part).map(r => r.emp))];
  const orders = ORDERS.filter(o => o.part === part).length;
  return `<div class="pcard" data-search="${esc(`${part} ${PARTS[part].name} ${people.join(' ')}`.toLowerCase())}">
    <div class="pc-head">
      <div><span class="big2">${part}</span> <span style="font-size:17px">${PARTS[part].name}</span>
        <span class="badge ${ok ? 'b-OK' : 'b-注意'}">${ok ? '入力できます' : `あと${issues}か所`}</span>
        ${orders ? `<button class="linkbtn" data-planpart="${part}">受注 ${orders}件を生産管理で見る</button>` : ''}</div>
      <div class="addrow"><button class="mini" data-addstep="${part}">＋ 工程を足す</button><button class="mini" data-qrpart="${part}">QRを印刷</button>
        <button class="mini" data-karte="${part}">カルテ</button><button class="mini" data-clonepart="${part}">これを元に新しい品番</button><button class="mini ${partEditing === part ? 'dark' : ''}" data-editpart="${part}">編集</button></div>
    </div>
    ${partEditing === part ? `<div class="pedit">
      <div class="addrow">
        <span class="spec">品番</span><input id="pe-code" class="fsel" value="${esc(part)}" style="width:150px">
        <span class="spec">名前</span><input id="pe-name" class="fsel" value="${esc(PARTS[part].name)}" style="width:150px">
        <span class="spec">図面</span><select id="pe-draw" class="fsel"><option value="">まだない</option>${Object.entries({ boss: 'ボスの図面（見本）', flange: 'フランジの図面（見本）', shaft: 'シャフトの図面（見本）' }).map(([k, v]) => `<option value="${k}" ${PARTS[part].drawing === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <button class="mini dark" id="peSave" data-part="${part}">保存</button><button class="mini" id="peCancel">やめる</button>
      </div>
      <p class="note">品番を変えると、担当・チェック項目・受注・過去の日報は新しい品番に付け替えます。<b>QR の開く先も変わるので、印刷済みの QR は刷り直してください。</b></p>
      <div class="addrow"><button class="mini del" id="peArchive" data-part="${part}" ${orders ? 'disabled' : ''}>この品番をしまう（使わなくなった）</button>
        <span class="note">${orders ? `受注が ${orders}件残っているのでしまえません` : '一覧・タブレット・QR・受注から隠れます。過去の日報は残り、いつでも戻せます'}</span></div>
    </div>` : ''}
    <div class="flow">${steps.map((s, i) => `${i ? '<span class="arrow">→</span>' : ''}
      <button class="pbox st-${s.st} ${masterEdit === `${part}|${s.proc}` ? 'sel' : ''}" data-pbox="${part}|${s.proc}">
        <span class="pnum">${i + 1}</span><b>${s.proc}</b><span class="spec">${[...new Set(s.routes.map(r => r.equip))].map(eqLabel).join('・') || eqLabel(s.equip)}</span>
        <span class="ppl">${s.routes.map(r => `${r.main ? '★' : ''}${r.emp.split(' ')[0]}`).join('・') || '担当なし'}</span>
        <span class="pmeta">${s.n ? `項目 ${s.n}` : '項目なし'}・${CT[`${part}|${s.proc}`] ?? '−'}分/個</span>
        <span class="pst">${ST_TXT[s.st]}</span>
      </button>`).join('') || '<span class="note">工程がありません。「＋ 工程を足す」から足してください。</span>'}</div>
    ${addStepFor === part ? `<div class="addrow" style="margin-top:10px"><span class="spec">足す工程：</span>${PROC_ORDER.filter(p => !PARTS[part].route.includes(p)).map(p => `<button class="chip sm" data-addstepproc="${part}|${p}">${p}<small>${(PROCESSES[p] || []).map(eqLabel).join('・')}</small></button>`).join('')}<button class="mini" data-addstep="">やめる</button></div>` : ''}
    ${masterEdit && masterEdit.split('|')[0] === part && PARTS[part].route.includes(masterEdit.split('|')[1]) ? stepPanelHtml(part, masterEdit.split('|')[1]) : ''}
  </div>`;
}

function wizardHtml() {
  const w = wiz;
  const copyables = proc => Object.keys(CHECKS).filter(k => k.split('|')[1] === proc && CHECKS[k].length && PARTS[k.split('|')[0]]);
  const codeOk = w.code.trim() && !PARTS[w.code.trim()], nameOk = !!w.name.trim();
  const stepsOk = w.steps.length > 0 && w.steps.every(s => s.emp && s.equip);
  const nCopy = w.steps.filter(s => s.items && s.items.startsWith('copy:')).length;
  const check = (ok, label, sub = '') => `<li class="${ok ? 'ok' : ''}"><span>${ok ? '✓' : '・'}</span>${label}${sub ? `<small>${sub}</small>` : ''}</li>`;
  let body = '';
  if (w.step === 1) {
    body = `
      <div class="group-label" style="margin-top:0">品番</div><input class="fsel big-in" id="wz-code" value="${esc(w.code)}" placeholder="例 4E30210080">
      ${w.code.trim() && PARTS[w.code.trim()] ? '<div class="err">この品番はもうあります</div>' : ''}
      <div class="group-label">名前</div><input class="fsel big-in" id="wz-name" value="${esc(w.name)}" placeholder="例 カラー">
      <div class="group-label">図面</div>
      <select class="fsel" id="wz-draw"><option value="">まだない（あとで付ける）</option>${Object.entries({ boss: 'ボスの図面を使う（見本）', flange: 'フランジの図面を使う（見本）', shaft: 'シャフトの図面を使う（見本）' }).map(([k, v]) => `<option value="${k}" ${w.drawing === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <p class="note">本番では、図面の PDF や写真をここで付けます。</p>
      <div class="addrow" style="margin-top:14px"><button class="mini" id="wzCancel">やめる</button><button class="mini dark" id="wzNext" ${codeOk && nameOk ? '' : 'disabled'}>次へ：工程と担当</button></div>`;
  } else if (w.step === 2) {
    body = `
      <p class="note" style="margin-top:0">この品番が通る工程を、<b>流れる順に</b>押してください。工程ごとに設備を選ぶと、その設備を使っている人が上に出ます。</p>
      <div class="chips">${PROC_ORDER.map(p => `<button class="chip sm" data-wzproc="${p}" ${w.steps.some(s => s.proc === p) ? 'disabled' : ''}>＋ ${p}<small>${(PROCESSES[p] || []).map(eqLabel).join('・')}</small></button>`).join('')}</div>
      ${w.steps.length ? `<div class="flow" style="margin-top:12px">${w.steps.map((s, i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="wzchip">${i + 1}. ${s.proc}</span>`).join('')}</div>
      <div class="tablewrap"><table class="list" style="min-width:720px;margin-top:8px">
        <tr><th>順</th><th>工程</th><th>設備</th><th>主担当（QRで入る人）</th><th>サイクルタイム（分/個）</th><th></th></tr>
        ${w.steps.map((s, i) => `<tr><td>${i + 1}</td><td><b>${s.proc}</b></td>
          <td><select class="fsel" data-wzf="${i}|equip">${(PROCESSES[s.proc] || []).map(e => `<option value="${e}" ${e === s.equip ? 'selected' : ''}>${eqLabel(e)}</option>`).join('')}</select></td>
          <td><select class="fsel" data-wzf="${i}|emp" style="${s.emp ? '' : 'background:#fef3c7'}">${empOptions(s.equip, s.emp)}</select></td>
          <td><input class="fsel" type="number" step="any" min="0" data-wzf="${i}|ct" value="${s.ct}" style="width:90px"></td>
          <td><button class="mini del" data-wzdel="${i}">外す</button></td></tr>`).join('')}
      </table></div>` : ''}
      <div class="addrow" style="margin-top:14px"><button class="mini" id="wzBack">戻る</button><button class="mini dark" id="wzNext" ${stepsOk ? '' : 'disabled'}>次へ：チェック項目</button></div>`;
  } else {
    body = `
      <p class="note" style="margin-top:0">工程ごとに、チェック項目の作り方を選びます。<b>似た品番があれば写す</b>のがいちばん早いです。ないときは「あとで作る」にして、品番のカードからひな形か紙の写真で作ります。</p>
      <table class="list" style="min-width:0">
        <tr><th>工程</th><th>チェック項目</th></tr>
        ${w.steps.map((s, i) => `<tr><td><b>${s.proc}</b><div class="spec">${eqLabel(s.equip)}・${s.emp}</div></td>
          <td><select class="fsel" data-wzf="${i}|items" style="min-width:320px">
            <option value="later" ${s.items === 'later' ? 'selected' : ''}>あとで作る（ひな形・紙の写真から）</option>
            ${copyables(s.proc).map(k => { const [p] = k.split('|'); return `<option value="copy:${k}" ${s.items === `copy:${k}` ? 'selected' : ''}>写す：${p} ${PARTS[p].name}（${CHECKS[k].length}項目）</option>`; }).join('')}
          </select></td></tr>`).join('')}
      </table>
      <div class="addrow" style="margin-top:14px"><button class="mini" id="wzBack">戻る</button><button class="mini dark" id="wzDone">この品番を登録する</button></div>`;
  }
  return `<div class="card wiz">
    <h2>品番を足す${w.from ? `<span class="spec">（${w.from} ${PARTS[w.from] ? PARTS[w.from].name : ''} を元に）</span>` : ''}</h2>
    <div class="wz-steps">${['品番と名前', '工程と担当', 'チェック項目'].map((t, i) => `<span class="${w.step === i + 1 ? 'on' : w.step > i + 1 ? 'done' : ''}">${i + 1}. ${t}</span>`).join('<b>›</b>')}</div>
    <div class="wz-grid">
      <div>${body}</div>
      <div class="wz-side"><div class="group-label" style="margin-top:0">入力できる状態か</div><ul class="ready">
        ${check(codeOk && nameOk, '品番と名前', w.code ? `${esc(w.code)} ${esc(w.name)}` : '')}
        ${check(w.steps.length > 0, '工程', w.steps.map(s => s.proc).join(' → '))}
        ${check(stepsOk, 'どの工程にも主担当がいる')}
        ${check(w.steps.length > 0 && nCopy === w.steps.length, 'チェック項目', w.step < 3 ? '' : `写す ${nCopy}・あとで ${w.steps.length - nCopy}`)}
        ${check(false, 'QR', '登録すると印刷できます')}
      </ul></div>
    </div>
  </div>`;
}

        <button class="mini dark" id="addRoute">この担当を足す</button>

let STOCKS = LS.get('kn-stock', null) || [];
const saveStocks = () => LS.set('kn-stock', STOCKS);
let stockCount = {};
function bookStock() {
  // 帳簿の数：受注ごとに「この工程まで済んだ数 − 次の工程まで済んだ数」。最後の工程の後は完成品（出荷はまだ見ていない）
  const rows = {};
  ORDERS.filter(o => PARTS[o.part] && !PARTS[o.part].archived).forEach(o => {
    const r = PARTS[o.part].route, done = r.map(q => Math.min(o.qty, (o.done || {})[q] || 0));
    r.forEach((q, i) => {
      const n = i < r.length - 1 ? done[i] - done[i + 1] : done[i];
      const key = `${o.part}|${q}`;
      rows[key] = (rows[key] || 0) + Math.max(0, n);
    });
  });
  return activeParts().flatMap(p => PARTS[p].route.map((q, i, arr) => ({ part: p, proc: q, last: i === arr.length - 1, next: arr[i + 1], book: rows[`${p}|${q}`] || 0 })));
}
function lastWorkdayOfMonth() { const d = new Date(); const e = new Date(d.getFullYear(), d.getMonth() + 1, 0); while (e.getDay() === 0 || e.getDay() === 6) e.setDate(e.getDate() - 1); return e; }

          <td>${df === null ? '<span class="spec">未入力</span>' : df === 0 ? '<span class="badge b-OK">合っている</span>' : `<span class="badge b-NG">${df > 0 ? '+' : ''}${df}</span>`}</td></tr>`; }).join('')}

        out.push({ id: 'm' + (++id), date: d, time: `08:${String(10 + qi * 7).padStart(2, '0')}`, part: p, proc: q, type: 'in', qty: n, emp }); st += n;
      }

        if (n > 0) { out.push({ id: 'm' + (++id), date: d, time: `16:${String(10 + qi * 7).padStart(2, '0')}`, part: p, proc: q, type: 'out', qty: n, emp }); st -= n; }

  else if (t.dataset.rate) { RATES[t.dataset.rate] = Math.min(100, Math.max(1, +t.value || 70)) / 100; commitMaster('稼働率を保存しました'); }
  else if (t.id === 'pp-team' || t.id === 'eq-proc') { /* 新しい係・工程の入力欄はいつも出している */ }
  else if (t.dataset.td) {
    const [i, field] = t.dataset.td.split('|');
    tplDraft[+i][field] = field === 'use' ? t.checked : t.value;
    if (field === 'use') render();
  }
  else if (t.id === 'copySrc') { copyFrom = t.value || null; render(); }
  else if (t.id === 'aiFile' && t.files[0]) { aiImg = URL.createObjectURL(t.files[0]); aiDraft = aiDraftFor(...masterEdit.split('|')); render(); }
  else if (t.dataset.photo && t.files.length) {
    const kind = t.dataset.photo;
    Promise.all([...t.files].map(fl => shrinkImage(fl))).then(srcs => {
      f.photos = [...(f.photos || []), ...srcs.map((src, i) => ({ id: 'p' + Date.now() + i, kind, src }))];
      toast(`${kind}の写真を${srcs.length}枚付けました`); render();
    });
  }
  else if (t.dataset.ad) {
    const [i, field] = t.dataset.ad.split('|'), it = aiDraft[+i];
    if (field === 'use' || field === 'checked') it[field] = t.checked;
    else if (['nom', 'tm', 'tp'].includes(field)) { let v = parseFloat(t.value) || 0; if (field === 'tm') v = -Math.abs(v); if (field === 'tp') v = Math.abs(v); it[field] = v; it.checked = true; }
    else it[field] = t.value;
    render();
  }
  else if (t.dataset.ce) {
    const [i, field] = t.dataset.ce.split('|'), it = CHECKS[masterEdit][+i];
    let v = t.value;
    if (['n', 'nom', 'tm', 'tp', 'step', 'warn'].includes(field)) v = parseFloat(v) || 0;
    if (field === 'tm') v = -Math.abs(v);
    if (field === 'tp') v = Math.abs(v);
    it[field] = v;
    if (field === 'type' && v === 'num' && it.nom === undefined) Object.assign(it, { nom: 0, tm: -0.1, tp: 0.1, step: 0.01, warn: 15 });
    saveMaster(); render(); toast('保存しました。タブレットにもすぐ反映されます');
  }
});

// 設備ごとの帯：ドラッグで順番・設備を変える
const clearOver = () => document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
document.addEventListener('dragstart', e => {
  const s = e.target.closest && e.target.closest('[data-seg]');
  if (!s) return;
  dragId = s.dataset.seg; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); s.classList.add('dragging');
});
document.addEventListener('dragover', e => {
  const t = e.target.closest && e.target.closest('[data-seg],[data-eqrow]');
  if (!t || !dragId) return;
  e.preventDefault(); clearOver(); t.classList.add('over');
});
document.addEventListener('drop', e => {
  const t = e.target.closest && e.target.closest('[data-seg],[data-eqrow]');
  clearOver();
  if (!t || !dragId) return;
  e.preventDefault();
  const [id, proc] = dragId.split('|'), eq = t.dataset.eq, o = ORDERS.find(x => x.id === id);
  dragId = null;
  if (EQUIP_PROC[eq] !== proc) { toast(`${eqLabel(eq)} は工程 ${EQUIP_PROC[eq]} の設備なので、工程 ${proc} は移せません`); return; }
  let msg = '';
  if (stepEq(o, proc) !== eq) { o.eq = { ...(o.eq || {}), [proc]: eq }; msg = `${id} の工程 ${proc} を ${eqLabel(eq)} に移しました`; }
  const target = t.dataset.seg ? t.dataset.seg.split('|')[0] : null;
  if (target && target !== id) { movePrio(id, target); msg = msg || `${id} を ${target} の${prioIds().indexOf(id) < prioIds().indexOf(target) ? '前' : '後'}に流すようにしました`; }
  if (!msg) return;
  saveOrders(); render(); toast(msg);
});
document.addEventListener('dragend', () => { clearOver(); dragId = null; document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });

// ---------- 起動 ----------
(() => {
  const q = new URLSearchParams(location.search);
  const draft = LS.get('kn-draft', null);
  if (q.get('part')) {
    if (draft && draft.part === q.get('part') && draft.proc === (q.get('proc') || draft.proc)) { f = { ...blankF(), ...draft }; toast('途中の入力を戻しました'); }
    else scan(q.get('part'), q.get('proc'), false);
  } else if (draft && draft.part) { f = { ...blankF(), ...draft }; toast('途中の入力を戻しました'); }
  view = 'input';
  render();
})();
</script>
</body>
</html>
